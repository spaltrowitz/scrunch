          "name": "What is the Curly Girl Method (CGM)?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Curly Girl Method (CGM) is a hair care approach that avoids sulfates, silicones, and heat styling to enhance natural curl patterns. It focuses on gentle cleansing, deep conditioning, and using CG-approved products."

          "@type": "Question",
          "name": "How do I check if a product is CG approved?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Use Scrunch's ingredient checker to paste any product's ingredient list and instantly see if it contains sulfates, silicones, or other non-CG ingredients. You can also browse our catalog of 410+ pre-checked products."
          }
        },
        {
          "@type": "Question",
          "name": "What curl pattern do I have?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Curl patterns range from 2A (loose waves) to 4C (tight coils). Type 2 is wavy, Type 3 is curly, and Type 4 is coily. Scrunch helps you find products that work for your specific pattern."
          }
        },
        {
          "@type": "Question",
          "name": "What is hair porosity and why does it matter?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Hair porosity describes how well your hair absorbs and retains moisture. Low porosity hair resists moisture, medium porosity absorbs well, and high porosity absorbs quickly but loses moisture fast. Knowing your porosity helps you pick the right products."
          }
        }
