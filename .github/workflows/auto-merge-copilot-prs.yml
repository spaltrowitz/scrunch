name: Auto-merge Copilot product PRs

# Enables auto-merge on PRs authored by the Copilot coding agent that
# add a requested product. Once required checks pass, GitHub merges
# the PR automatically — no manual review needed.
#
# Safety: only fires when both the author is Copilot AND the PR touches
# product-data files (src/data/**, supabase/migrations/**). Will not
# auto-merge arbitrary Copilot PRs.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >
      (
        github.event.pull_request.user.login == 'copilot-swe-agent[bot]' ||
        github.event.pull_request.user.login == 'Copilot' ||
        github.event.pull_request.user.login == 'app/copilot-swe-agent'
      )
    steps:
      - name: Verify PR scope is product data
        id: scope
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner: context.repo.owner, repo: context.repo.repo,
                pull_number: context.payload.pull_request.number, per_page: 100 }
            );
            const allowed = files.length > 0 && files.every(f =>
              f.filename.startsWith('src/data/') ||
              f.filename.startsWith('src/test/') ||
              f.filename.startsWith('supabase/migrations/') ||
              f.filename === 'src/lib/ingredients/ingredientData.ts'
            );
            console.log(`Files: ${files.map(f => f.filename).join(', ')}`);
            console.log(`In-scope: ${allowed}`);
            core.setOutput('in_scope', allowed ? 'true' : 'false');

      - name: Mark PR ready for review (if draft)
        if: steps.scope.outputs.in_scope == 'true' && github.event.pull_request.draft == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr ready "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}"

      - name: Enable auto-merge (squash)
        if: steps.scope.outputs.in_scope == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --squash --auto --delete-branch
