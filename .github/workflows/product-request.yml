name: Auto-add requested product
on:
  issues:
    types: [opened]

jobs:
  process-product-request:
    # Run on issues with 'product-request' or 'brand-scan' label
    if: >
      contains(github.event.issue.labels.*.name, 'product-request') ||
      contains(github.event.issue.labels.*.name, 'brand-scan')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Basic spam check
        id: spam_check
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title || '';
            const body = context.payload.issue.body || '';
            const combined = (title + ' ' + body).toLowerCase();

            // Valid hair care category keywords from the issue template
            const validCategories = [
              'shampoo', 'conditioner', 'co-wash', 'deep conditioner', 'hair mask',
              'leave-in', 'curl cream', 'styling cream', 'gel', 'mousse', 'foam',
              'custard', 'pudding', 'oil', 'serum', 'spray', 'refresher',
              'protein treatment', 'scalp treatment', 'low-poo', 'clarifying',
              'not sure'
            ];
            const hasValidCategory = validCategories.some(cat => combined.includes(cat));

            // Check for minimum content quality
            const brand = body.match(/### Brand\s*\n(.+)/i)?.[1]?.trim() || '';
            const productName = body.match(/### Product Name\s*\n(.+)/i)?.[1]?.trim() || '';
            const hasBrand = brand.length >= 2 && brand.length <= 100;
            const hasProductName = productName.length >= 2 && productName.length <= 200;

            // Check for suspicious patterns
            const suspiciousPatterns = [
              /(.)\1{9,}/,  // 10+ repeated characters
              /\b(test|asdf|qwerty|lorem|ipsum|foo|bar|baz)\b/i,
            ];
            const isSuspicious = suspiciousPatterns.some(p => p.test(combined));

            const isValid = hasBrand && hasProductName && !isSuspicious;

            if (!isValid) {
              const reasons = [];
              if (!hasBrand) reasons.push('missing or invalid brand name');
              if (!hasProductName) reasons.push('missing or invalid product name');
              if (isSuspicious) reasons.push('contains suspicious content');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `⚠️ **Scrunch Bot**: This product request didn't pass our validation checks (${reasons.join(', ')}).\n\nIf this is a legitimate hair care product, please edit the issue to include a valid brand name and product name, and a maintainer will re-review it.`
              });

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['needs-review']
              });

              core.setOutput('valid', 'false');
              return;
            }

            core.setOutput('valid', 'true');

      - name: Assign Copilot coding agent
        if: steps.spam_check.outputs.valid == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // Copilot is a Bot actor, not a User — REST addAssignees only accepts Users.
            // Use GraphQL: look up the Copilot suggested actor for this repo, then
            // call replaceActorsForAssignable with the bot's node ID.
            const issueNodeId = context.payload.issue.node_id;

            const suggested = await github.graphql(`
              query($owner: String!, $name: String!) {
                repository(owner: $owner, name: $name) {
                  suggestedActors(capabilities: [CAN_BE_ASSIGNED], first: 100) {
                    nodes { login __typename ... on Bot { id } ... on User { id } }
                  }
                }
              }
            `, { owner: context.repo.owner, name: context.repo.repo });

            const copilot = suggested.repository.suggestedActors.nodes.find(
              n => n.login === 'copilot-swe-agent' || n.login === 'Copilot'
            );

            if (!copilot) {
              core.warning(
                'Copilot coding agent not available as an assignee. ' +
                'Enable it at: Repo Settings → Code, planning, and automation → Copilot → Coding agent.'
              );
              return;
            }

            await github.graphql(`
              mutation($assignableId: ID!, $actorIds: [ID!]!) {
                replaceActorsForAssignable(input: { assignableId: $assignableId, actorIds: $actorIds }) {
                  assignable { ... on Issue { number } }
                }
              }
            `, { assignableId: issueNodeId, actorIds: [copilot.id] });

            console.log(`Assigned ${copilot.login} (${copilot.__typename}) to issue #${context.issue.number}`);

            const isBrandScan = context.payload.issue.labels.some(l => l.name === 'brand-scan')

            // Add processing comment
            const message = isBrandScan
              ? `🤖 **Scrunch Bot**: Scanning this brand's full product line!\n\nI'll:\n1. Search for all curly hair products from this brand\n2. Cross-reference against the existing database\n3. Create individual product requests for any missing products\n\nThis may take several minutes.`
              : `🤖 **Scrunch Bot**: Processing this product request!\n\nI'll:\n1. Look up the product details and ingredients\n2. Find a product image\n3. Run CG ingredient analysis\n4. Create a PR to add it to the database\n\nThis usually takes a few minutes.`

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message,
            });
