name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy submit-feedback
        run: supabase functions deploy submit-feedback --project-ref rqmplfyuonkikdmqngrj
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE }}

      - name: Deploy create-product-issue
        run: supabase functions deploy create-product-issue --project-ref rqmplfyuonkikdmqngrj
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE }}

      - name: Deploy notify-product-added
        run: supabase functions deploy notify-product-added --project-ref rqmplfyuonkikdmqngrj
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE }}

      - name: Deploy find-product-image
        run: supabase functions deploy find-product-image --project-ref rqmplfyuonkikdmqngrj
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE }}
